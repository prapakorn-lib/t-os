version: "3.8"

services:
  os-lab-exam:
    build:
      context: .
      dockerfile: Dockerfile
    image: os-lab-exam:latest
    container_name: os-lab-exam
    hostname: lab-server
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
      - "8001:8001"
    # ให้ student มีสิทธิ์ทำทุกอย่างที่จำเป็น
    cap_add:
      - SYS_PTRACE
    # restart policy สำหรับการสอบ
    restart: "no"
